[project]
name = "heuristictree"
version = "2.0.0"
description = "Heuristic Methods for Minimizing Cut Bars and Using Leftovers from the One-dimensional Cutting Process"
authors = [{ name = "Matheus Pimenta", email = "matheus.pimenta@outlook.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Topic :: Scientific/Engineering :: Mathematics",
    "Natural Language :: English",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.urls]
Code = "https://github.com/omatheuspimenta/heuristictree"
"Bug Tracker" = "https://github.com/omatheuspimenta/heuristictree/issues"

[project.scripts]
heuristictree = "heuristictree.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "taskipy>=1.14.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "heuristictree"
module-root = ""

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--doctest-modules"
testpaths = ["heuristictree", "tests"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E741: `l` is the paper's notation for item lengths. B008: Typer declares
# CLI options through function calls in argument defaults.
ignore = ["E741", "B008"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.taskipy.tasks]
lintchk = "ruff format --check ."
lintcng = "ruff format ."
lint = "ruff check ."
pre_test = "task lintchk && task lint"
test = "pytest -x --cov=heuristictree -v"
post_test = "coverage html"
benchmark = "python scripts/benchmark.py"
