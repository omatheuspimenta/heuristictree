name: Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Run the v1 vs v2 benchmark on data/execution"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tests read the v1.0.3 release from git
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest --cov=heuristictree --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl heuristictree --version
          uv run --isolated --no-project --with dist/*.whl \
            heuristictree run data/tests/test.txt -o /tmp/output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Benchmark v1.0.3 vs current
        run: |
          uv run python scripts/benchmark.py --v1-ref v1.0.3 --json results.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results.json
